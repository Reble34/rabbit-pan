# ============================================================
# Rabbit 网盘 · Nginx 站点配置（前端容器内置）
# 托管静态资源 + 反代 API + 短链 302 + 大文件上传优化 + 限流 + Gzip
# ============================================================

# 限流区域：API 30 次/秒；短链与提取码 10 次/秒（突发可放大）
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=short_zone:10m rate=10r/s;

upstream rabbit_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 大文件上传：允许分片请求体到 100MB（单文件大小由后端配置控制）
    client_max_body_size 1024m;
    client_body_buffer_size 1m;
    client_body_timeout 600s;

    # ============ Gzip 压缩 ============
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ============ 前端静态资源（带 hash，强缓存） ============
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============ API 反向代理 ============
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://rabbit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖式传递（非追加）：客户端伪造的 X-Forwarded-For 在此被丢弃，后端据此限流/审计
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传/下载超时放宽
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;   # 流式转发，降低上传内存占用
        proxy_buffering off;
    }

    # ============ 12 位短链跳转 /s/{code} => 后端 302 ============
    location /s/ {
        limit_req zone=short_zone burst=20 nodelay;
        proxy_pass http://rabbit_backend/api/v1/s/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
