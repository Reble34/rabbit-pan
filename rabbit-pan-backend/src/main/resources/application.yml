server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: rabbit-pan-backend
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB        # 单个 HTTP 请求体上限（分片上传每片远小于此值）
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{requestId:-SYSTEM}]"
  level:
    com.rabbit.pan: info

# ===== 业务自定义配置（各环境文件中覆盖）=====
rabbit:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-32-bytes-at-least}
    access-expire-hours: 2
    refresh-expire-days: 7
  share-salt: ${SHARE_SALT:change-me-too}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  admin-init-password: ${ADMIN_PASSWORD:Admin@123456}
  # CORS 白名单：同源部署保持注释即关闭跨域；需跨域时在此列举来源（如 http://localhost:5173）
  upload:
    chunk-size-mb: 5            # 分片大小，MinIO compose 要求除最后一片外 >= 5MB
    chunk-expire-hours: 24      # 分片任务在 Redis 中的有效期
  snowflake:
    worker-id: 1
    datacenter-id: 1
