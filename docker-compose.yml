services:
  # ============ MySQL 8.0（仅内网，不对外暴露端口） ============
  mysql:
    image: mysql:8.0
    container_name: rabbit-pan-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-rabbit_pan}
      MYSQL_USER: ${DB_USER:-rabbit}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - rabbit-net

  # ============ Redis 7（仅内网；短链映射/登录态/分片状态/限流） ============
  redis:
    image: redis:7-alpine
    container_name: rabbit-pan-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rabbit-net

  # ============ MinIO 对象存储（仅内网；控制台仅本机 127.0.0.1 可访问） ============
  minio:
    image: minio/minio:latest
    container_name: rabbit-pan-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO 控制台，仅本机访问
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - rabbit-net

  # ============ 后端 Spring Boot（内网） ============
  backend:
    build: ./rabbit-pan-backend
    image: rabbit-pan-backend:1.0.0
    container_name: rabbit-pan-backend
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      # --- MySQL ---
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-rabbit_pan}
      DB_USER: ${DB_USER:-rabbit}
      DB_PASSWORD: ${DB_PASSWORD}
      # --- Redis ---
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # --- MinIO ---
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-rabbit-pan}
      # --- 业务密钥 ---
      JWT_SECRET: ${JWT_SECRET}
      SHARE_SALT: ${SHARE_SALT}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # --- 前端地址（短链跳转用） ---
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - rabbit-net

  # ============ 前端 Nginx（唯一对外端口） ============
  frontend:
    build: ./rabbit-pan-frontend
    image: rabbit-pan-frontend:1.0.0
    container_name: rabbit-pan-frontend
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - rabbit-net

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  rabbit-net:
    driver: bridge
